<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Play Store">
<style>*{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head><body>
<title>Play Store Scanner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Courier+Prime:wght@400;700&display=swap">
<style>
/* Layout: one-screen register. Scanner window left, receipt paper right; stacks top/bottom in portrait. Single deliberate look (toy cash register). */
:root{
  --counter:#2f5d8a;      /* register body */
  --counter-dk:#23476b;
  --paper:#fffaf0;        /* receipt */
  --ink:#2b2622;
  --ink-soft:#8a7f73;
  --laser:#ff3b30;
  --go:#2fb35a;           /* pay */
  --warn:#f2a20c;         /* start over */
  --sun:#ffd23f;          /* total */
  --glass:#101820;
  --f-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-receipt:"Courier Prime","Courier New",ui-monospace,monospace;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--counter);color:var(--ink);font-family:var(--f-display);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
svg{display:block}

.app{height:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (orientation:portrait){.app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,0.85fr) minmax(0,1.15fr)}}

/* ---------- scanner ---------- */
.scanner{position:relative;min-width:0;min-height:0;background:var(--glass);border-radius:28px;overflow:hidden;box-shadow:inset 0 0 0 10px var(--counter-dk)}
.scanner video,.scanner .still{position:absolute;inset:10px;width:calc(100% - 20px);height:calc(100% - 20px);object-fit:cover;border-radius:18px}
.scanner video.mirror{transform:scaleX(-1)}
.laser{position:absolute;left:24px;right:24px;height:4px;top:50%;background:var(--laser);border-radius:4px;box-shadow:0 0 16px 4px rgba(255,59,48,.7);animation:sweep 2.2s ease-in-out infinite alternate}
@keyframes sweep{from{top:22%}to{top:78%}}
.flash{position:absolute;inset:10px;border-radius:18px;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .35s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.scan-label{position:absolute;top:22px;left:24px;background:rgba(16,24,32,.7);color:#fff;padding:4px 14px;border-radius:999px;font-size:18px;font-weight:800;letter-spacing:.06em}
.scan-label i{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--laser);margin-right:8px;vertical-align:1px}
.cam-tools{position:absolute;right:22px;top:20px;display:flex;gap:10px}
.round{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;color:var(--counter-dk)}
.round[aria-pressed="false"]{background:rgba(255,255,255,.35);color:#fff}
.round svg{width:28px;height:28px}
.bigscan{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--laser);color:#fff;font-size:28px;font-weight:800;padding:12px 30px 10px;border-radius:999px;box-shadow:0 6px 0 #b32018}
.bigscan:active{transform:translateX(-50%) translateY(4px);box-shadow:0 2px 0 #b32018}
.bigscan svg{width:36px;height:36px}
.popup{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(.6);opacity:0;background:var(--sun);color:var(--ink);font-size:30px;font-weight:800;padding:10px 24px 6px;border-radius:20px;text-align:center;line-height:1.1;pointer-events:none;max-width:80%;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.popup small{display:block;font-family:var(--f-receipt);font-size:24px;font-weight:700}
.popup.go{animation:pop 1.4s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.nocam{position:absolute;inset:10px;display:grid;place-items:center;text-align:center;color:#cfe0f0;font-size:20px;padding:24px;line-height:1.3}

/* ---------- receipt ---------- */
.register{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;background:var(--paper);border-radius:28px;overflow:hidden;box-shadow:0 10px 0 var(--counter-dk)}
.r-head{padding:14px 22px 8px;text-align:center;border-bottom:3px dashed #e3d8c6}
.r-head h1{margin:0;font-size:34px;line-height:1;font-weight:800;color:var(--counter);text-wrap:balance}
.r-head p{margin:2px 0 0;font-family:var(--f-receipt);color:var(--ink-soft);font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.items{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 14px;display:flex;flex-direction:column;gap:8px}
.empty{margin:auto;text-align:center;color:var(--ink-soft);font-size:24px;line-height:1.2;padding:20px}
.empty svg{width:90px;height:90px;margin:0 auto 8px;color:#d9ccb8}
.row{display:grid;grid-template-columns:76px minmax(0,1fr) auto 60px;align-items:center;gap:12px;padding:6px;border-radius:16px}
.row.new{animation:newrow 1.2s ease-out}
@keyframes newrow{0%{background:var(--sun)}100%{background:transparent}}
.row img{width:76px;height:76px;object-fit:cover;border-radius:12px;background:#eee4d4}
.row .nm{font-size:24px;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.row .pr{font-family:var(--f-receipt);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.del{width:60px;height:60px;border-radius:16px;background:#f3e9da;color:#b3352a;display:grid;place-items:center}
.del svg{width:30px;height:30px}
.totalbar{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 22px;border-top:3px dashed #e3d8c6;background:var(--paper)}
.totalbar .lbl{font-size:26px;font-weight:800;letter-spacing:.04em}
.totalbar .cnt{font-family:var(--f-receipt);color:var(--ink-soft);font-size:18px}
.totalbar .amt{font-family:var(--f-receipt);font-weight:700;font-size:44px;font-variant-numeric:tabular-nums;background:var(--sun);padding:0 12px;border-radius:12px}
.actions{display:grid;grid-template-columns:1fr 1.6fr;gap:14px;padding:4px 16px 16px}
.act{display:flex;align-items:center;justify-content:center;gap:12px;min-height:84px;border-radius:22px;font-size:30px;font-weight:800;color:#fff}
.act svg{width:46px;height:46px}
.act.clear{background:var(--warn);box-shadow:0 6px 0 #b67800}
.act.pay{background:var(--go);box-shadow:0 6px 0 #1d7a3b}
.act:active{transform:translateY(4px);box-shadow:none}
.act:disabled{opacity:.45}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(20,40,60,.72);padding:24px}
.card{background:var(--paper);border-radius:32px;padding:28px 32px;text-align:center;max-width:620px;width:100%;box-sizing:border-box;box-shadow:0 12px 0 var(--counter-dk)}
.card h2{margin:0 0 6px;font-size:40px;line-height:1.05;color:var(--counter);text-wrap:balance}
.card .big{font-family:var(--f-receipt);font-weight:700;font-size:64px;font-variant-numeric:tabular-nums;margin:4px 0 18px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.choice{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 10px 12px;border-radius:24px;font-size:28px;font-weight:800;color:#fff}
.choice svg{width:88px;height:88px}
.choice.yes{background:var(--go);box-shadow:0 6px 0 #1d7a3b}
.choice.no{background:#9aa7b4;box-shadow:0 6px 0 #6b7784}
.choice.cash{background:var(--go);box-shadow:0 6px 0 #1d7a3b}
.choice.cardp{background:var(--counter);box-shadow:0 6px 0 var(--counter-dk)}
.choice:active{transform:translateY(4px);box-shadow:none}
.start-btn{margin-top:14px;display:inline-flex;align-items:center;gap:14px;background:var(--go);color:#fff;font-size:36px;font-weight:800;padding:16px 40px 12px;border-radius:999px;box-shadow:0 7px 0 #1d7a3b}
.start-btn svg{width:44px;height:44px}
.card p{font-size:20px;color:var(--ink-soft);margin:6px 0 0;line-height:1.3}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (max-height:620px){.row{grid-template-columns:56px minmax(0,1fr) auto 52px}.row img{width:56px;height:56px}.del{width:52px;height:52px}.act{min-height:64px;font-size:24px}.totalbar .amt{font-size:34px}}
@media (prefers-reduced-motion:reduce){.laser{animation:none}.popup.go,.row.new,.flash.go{animation-duration:.01s}}
</style>

<div class="app">
  <section class="scanner" id="scanner" aria-label="Scanner">
    <video id="video" playsinline muted autoplay hidden></video>
    <img class="still" id="still" alt="" hidden>
    <div class="nocam" id="nocam" hidden>Tap the red button to scan a toy!</div>
    <div class="laser" aria-hidden="true"></div>
    <div class="flash" id="flash"></div>
    <div class="scan-label"><i></i>SCANNER</div>
    <div class="cam-tools">
      <button class="round" id="autoBtn" aria-pressed="true" aria-label="Auto scan on or off" title="Auto scan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="round" id="soundBtn" aria-pressed="true" aria-label="Sound on or off" title="Sound">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>
      </button>
      <button class="round" id="flipBtn" aria-label="Switch camera" title="Switch camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9 13a3 3 0 0 1 5.2-2M15 13a3 3 0 0 1-5.2 2"/><path d="M14 9v2h-2M10 17v-2h2"/></svg>
      </button>
    </div>
    <div class="popup" id="popup"></div>
    <button class="bigscan" id="scanBtn" aria-label="Scan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 7V4h3M18 4h3v3M21 17v3h-3M6 20H3v-3"/><path d="M7 8v8M10 8v8M13 8v8M16 8v8"/></svg>
      SCAN
    </button>
    <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
  </section>

  <section class="register" aria-label="Shopping list">
    <header class="r-head">
      <h1>Play Store</h1>
      <p id="dateLine">Lane 1 · Thank you for shopping</p>
    </header>
    <div class="items" id="items"></div>
    <div class="totalbar">
      <div><div class="lbl">TOTAL</div><div class="cnt" id="count">0 items</div></div>
      <div class="amt" id="total">$0.00</div>
    </div>
    <div class="actions">
      <button class="act clear" id="clearBtn" aria-label="Start over">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/><path d="M10 11v6M14 11v6"/></svg>
        <span>Clear</span>
      </button>
      <button class="act pay" id="payBtn" aria-label="Pay">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9.5v5M18 9.5v5"/></svg>
        <span>Pay</span>
      </button>
    </div>
  </section>
</div>

<!-- start -->
<div class="overlay" id="startOv">
  <div class="card">
    <h2>Play Store is open!</h2>
    <p>Hold a toy up to the camera. The scanner beeps and adds it to the list.</p>
    <button class="start-btn" id="startBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9a3 3 0 0 0 6 0 3 3 0 0 0 6 0 3 3 0 0 0 6 0"/><path d="M10 20v-5h4v5"/></svg>
      Open
    </button>
  </div>
</div>

<!-- confirm clear -->
<div class="overlay" id="clearOv" hidden>
  <div class="card">
    <h2>Start over?</h2>
    <div class="choices" style="margin-top:16px">
      <button class="choice yes" id="clearYes" aria-label="Yes, clear">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>Yes</button>
      <button class="choice no" id="clearNo" aria-label="No, keep">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>No</button>
    </div>
  </div>
</div>

<!-- pay -->
<div class="overlay" id="payOv" hidden>
  <div class="card" id="payCard">
    <h2>That will be…</h2>
    <div class="big" id="payTotal">$0.00</div>
    <div class="choices">
      <button class="choice cash" data-pay="cash" aria-label="Pay with cash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 9.5v5M18 9.5v5"/></svg>Cash</button>
      <button class="choice cardp" data-pay="card" aria-label="Pay with card">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M2 10h20M6 15h4"/></svg>Card</button>
    </div>
    <button class="choice no" id="payBack" style="margin:18px auto 0;flex-direction:row;padding:10px 26px;font-size:22px" aria-label="Go back">
      <svg viewBox="0 0 24 24" style="width:30px;height:30px" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
  </div>
</div>

<div class="overlay" id="thanksOv" hidden>
  <div class="card">
    <h2 style="font-size:56px">Thank you!</h2>
    <p style="font-size:24px">Come again soon!</p>
    <button class="start-btn" id="nextBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      Next shopper</button>
  </div>
</div>
<canvas id="confetti"></canvas>

<script>
(function(){
const $=id=>document.getElementById(id);
const video=$("video"), itemsEl=$("items");
let cart=[], stream=null, facing="user", auto=true, sound=true, camOK=false, audioCtx=null;

/* ---------- made-up names & prices ---------- */
const ADJ=["Sparkly","Super","Tiny","Giant","Fuzzy","Bouncy","Crunchy","Magic","Silly","Rainbow","Jumbo","Squishy","Golden","Zoomy","Wiggly","Fancy","Mega","Cozy","Spotty","Frosty","Stinky","Shiny","Wobbly","Sleepy","Royal","Chunky","Polka-Dot","Turbo"];
const NOUN=["Banana","Dino Snack","Robot","Cupcake","Pickle","Teddy","Rocket","Noodles","Truck","Unicorn Juice","Cookie","Tractor","Pancake","Kitty","Jellybeans","Pizza","Bubble Gum","Monster","Socks","Taco","Moon Cheese","Puppy Treats","Muffin","Lollipop","Dragon Egg","Spaghetti","Doughnut","Gummy Worms","Bubble Wand","Pirate Map"];
const CENTS=[0,25,49,50,75,99,99,99];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function makeItem(thumb){
  let name; do{ name=pick(ADJ)+" "+pick(NOUN);}while(cart.length&&cart[cart.length-1].name===name);
  const dollars=Math.random()<.6?1+Math.floor(Math.random()*5):Math.floor(Math.random()*10);
  let cents=dollars*100+pick(CENTS); if(cents<25)cents=99;
  return {id:Date.now()+Math.random(),name,cents,thumb};
}
const money=c=>"$"+(c/100).toFixed(2);

/* ---------- render ---------- */
const EMPTY=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11.5l2-8H6.2"/></svg>Your cart is empty.<br>Scan a toy!</div>`;
function render(newId){
  if(!cart.length){itemsEl.innerHTML=EMPTY;}
  else{
    itemsEl.innerHTML="";
    for(const it of cart){
      const r=document.createElement("div"); r.className="row"+(it.id===newId?" new":"");
      const img=document.createElement("img"); img.src=it.thumb||""; img.alt="";
      const nm=document.createElement("div"); nm.className="nm"; nm.textContent=it.name;
      const pr=document.createElement("div"); pr.className="pr"; pr.textContent=money(it.cents);
      const d=document.createElement("button"); d.className="del"; d.setAttribute("aria-label","Remove "+it.name);
      d.innerHTML=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>`;
      d.onclick=()=>{cart=cart.filter(x=>x!==it);boop();render();};
      r.append(img,nm,pr,d); itemsEl.append(r);
    }
    itemsEl.scrollTop=itemsEl.scrollHeight;
  }
  const t=cart.reduce((s,i)=>s+i.cents,0);
  $("total").textContent=money(t);
  $("count").textContent=cart.length+(cart.length===1?" item":" items");
  $("payBtn").disabled=!cart.length; $("clearBtn").disabled=!cart.length;
  try{localStorage.setItem("playstore-cart",JSON.stringify(cart.slice(-40)));}catch(e){}
}

/* ---------- sound ---------- */
function tone(freq,dur,type="square",vol=.08,delay=0){
  if(!sound||!audioCtx)return;
  const t=audioCtx.currentTime+delay,o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g).connect(audioCtx.destination);o.start(t);o.stop(t+dur+.02);
}
const beep=()=>tone(1760,.14);
const boop=()=>tone(300,.12,"triangle",.12);
const chaChing=()=>{tone(1318,.12,"square",.07);tone(1760,.35,"square",.07,.12);tone(2637,.4,"sine",.05,.12);};
function say(txt){
  if(!sound||!("speechSynthesis" in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.rate=1;u.pitch=1.2;speechSynthesis.speak(u);}catch(e){}
}

/* ---------- scanning ---------- */
const thumbC=document.createElement("canvas"); thumbC.width=thumbC.height=160;
function grabThumb(src,w,h,mirror){
  const x=thumbC.getContext("2d"), s=Math.min(w,h);
  x.save(); if(mirror){x.translate(160,0);x.scale(-1,1);}
  x.drawImage(src,(w-s)/2,(h-s)/2,s,s,0,0,160,160); x.restore();
  return thumbC.toDataURL("image/jpeg",.7);
}
let lastScan=0;
function addScan(thumb){
  lastScan=performance.now();
  const it=makeItem(thumb); cart.push(it); render(it.id);
  beep(); const f=$("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  const p=$("popup"); p.innerHTML=""; p.append(it.name); const sm=document.createElement("small"); sm.textContent=money(it.cents); p.append(sm);
  p.classList.remove("go"); void p.offsetWidth; p.classList.add("go");
  setTimeout(()=>say(it.name+", "+money(it.cents)),250);
}
function manualScan(){
  if(camOK&&video.videoWidth){addScan(grabThumb(video,video.videoWidth,video.videoHeight,facing==="user"));}
  else $("fileCam").click();
}
$("scanBtn").onclick=manualScan;
$("fileCam").onchange=e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const img=new Image(); img.onload=()=>{const th=grabThumb(img,img.naturalWidth,img.naturalHeight,false);$("still").src=th;$("still").hidden=false;$("nocam").hidden=true;addScan(th);URL.revokeObjectURL(img.src);};
  img.src=URL.createObjectURL(f); e.target.value="";
};

/* motion: compare small grayscale frames to a learned empty background */
const W=48,H=36, mc=document.createElement("canvas"); mc.width=W;mc.height=H;
const mx=mc.getContext("2d",{willReadFrequently:true});
let bg=null, prev=null, state="empty", hits=0, quiet=0, holdSince=0;
function frame(){
  mx.drawImage(video,0,0,W,H);
  const d=mx.getImageData(0,0,W,H).data, g=new Float32Array(W*H);
  for(let i=0,j=0;j<g.length;i+=4,j++) g[j]=d[i]*.3+d[i+1]*.59+d[i+2]*.11;
  return g;
}
function frac(a,b,th){let n=0;for(let i=0;i<a.length;i++) if(Math.abs(a[i]-b[i])>th)n++;return n/a.length;}
function tick(){
  if(!camOK||!video.videoWidth||document.hidden) return;
  const cur=frame();
  if(!bg){bg=cur.slice();prev=cur;return;}
  const diff=frac(cur,bg,28), motion=frac(cur,prev,22); prev=cur;
  const now=performance.now();
  if(state==="empty"){
    if(diff<.05) for(let i=0;i<bg.length;i++) bg[i]+= (cur[i]-bg[i])*.08;   // follow slow light changes
    if(auto && diff>.12 && now-lastScan>1500){ hits++; if(hits>=3 && motion<.10){ addScan(grabThumb(video,video.videoWidth,video.videoHeight,facing==="user")); state="holding"; holdSince=now; hits=0; } }
    else hits=0;
  }else{
    if(diff<.07){ if(++quiet>=5){state="empty";quiet=0;} } else quiet=0;
    if(now-holdSince>6000 && motion<.04){ bg=cur.slice(); state="empty"; }   // something left in view: treat it as background
  }
}
setInterval(tick,120);

async function startCam(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia) throw 0;
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing,width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=stream; video.hidden=false; await video.play().catch(()=>{});
    video.classList.toggle("mirror",facing==="user");
    camOK=true; bg=null; state="empty"; $("nocam").hidden=true; $("still").hidden=true;
    $("autoBtn").hidden=false; $("flipBtn").hidden=false;
  }catch(e){
    camOK=false; video.hidden=true; $("nocam").hidden=false;
    $("autoBtn").hidden=true; $("flipBtn").hidden=true;
  }
}
$("flipBtn").onclick=()=>{facing=facing==="user"?"environment":"user";startCam();};
$("autoBtn").onclick=e=>{auto=!auto;e.currentTarget.setAttribute("aria-pressed",auto);};
$("soundBtn").onclick=e=>{sound=!sound;e.currentTarget.setAttribute("aria-pressed",sound);if(!sound&&"speechSynthesis" in window)speechSynthesis.cancel();};

/* ---------- start / clear / pay ---------- */
$("startBtn").onclick=async()=>{
  try{audioCtx=new (window.AudioContext||window.webkitAudioContext)(); await audioCtx.resume();}catch(e){}
  $("startOv").hidden=true; tone(880,.1,"sine",.08); tone(1320,.15,"sine",.08,.1);
  startCam();

};

document.querySelectorAll("[data-pay]").forEach(b=>b.onclick=()=>{

});

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=$("confetti"),x=c.getContext("2d"); c.width=innerWidth;c.height=innerHeight;
  const cols=["#ffd23f","#ff3b30","#2fb35a","#2f5d8a","#f2a20c","#ff8fb1"];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.3,s:6+Math.random()*8,c:pick(cols)}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);for(const p of ps){p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();}
    if(++t<200)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);})();
}

/* restore an unfinished cart after a reload */
try{const s=JSON.parse(localStorage.getItem("playstore-cart")||"[]");if(Array.isArray(s))cart=s;}catch(e){}
render();
})();
